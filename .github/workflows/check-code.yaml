name: Check Code

on:
  push:
  merge_group:
    types: [checks_requested]

jobs:
  check-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      # Every check runs even if an earlier one failed, and fails the job itself.
      - name: Format
        run: uv run ruff format . --check
      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run ruff check .
      - name: Test
        if: ${{ !cancelled() }}
        run: uv run pytest
      - name: Type Check
        if: ${{ !cancelled() }}
        run: uv run mypy -p aserehe --strict
      - name: Security Check
        if: ${{ !cancelled() }}
        run: |
          uv run bandit -r src
          uv run bandit -r tests --skip B101

  check-markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --global prettier@3.5.0 markdownlint-cli@0.44.0

      - name: Lint Markdown
        run: |
          markdownlint '**/*.md'

      - name: Format Markdown
        run: |
          prettier --check '**/*.md'
